name: Build

# Every push to main builds both apps (downloadable from the run page for 90 days).
# Pushing a tag like v0.1.0 also publishes them as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Qt runtime libraries (offscreen)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libgl1
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
      - run: python build.py
      - name: Smoke test (source)
        run: python main.py --check
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir out
          tar -czf out/SystemPet-linux-x86_64.tar.gz -C dist SystemPet   # tar keeps the executable bit
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir out
          cp dist/SystemPet.exe out/SystemPet-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: SystemPet-${{ runner.os }}
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'EOF'
          A customizable desktop pet for Windows and Linux.

          **Windows:** download `SystemPet-windows-x64.exe` and double-click it. The app is not code-signed,
          so Windows SmartScreen may warn: click *More info*, then *Run anyway*. This build has had limited testing on Windows.

          **Linux:** download `SystemPet-linux-x86_64.tar.gz`, then run
          `tar -xzf SystemPet-linux-x86_64.tar.gz && ./SystemPet`.
          You may need `sudo apt install libxcb-cursor0 libegl1 libxkbcommon-x11-0`.

          Find the tray icon (or right-click the pet) to open Settings.
          EOF
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "System Pet $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --prerelease
